<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registration &#x2014; Workout App Prototype</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <div class="background-orb-top" data-agent-id="el-001"></div>
    <div class="background-orb-bottom" data-agent-id="el-001"></div>
    <main class="content" data-agent-id="el-046">
      <div class="shell" data-agent-id="el-047">
        <div class="top-bar" data-agent-id="el-004">
          <div data-agent-id="el-005">
            <div class="brand" data-agent-id="el-006">Workout App</div>
            <div class="title" data-agent-id="el-007">Train smart. Look sharp.</div>
            <div class="subtitle" data-agent-id="el-008">Die App ist wieder funktional, sportlich und auf echte Nutzung ausgelegt.</div>
          </div>
          <div class="top-bar-meta" data-agent-id="el-009">
            <div class="meta-label" data-agent-id="el-010">GUEST MODE</div>
            <div class="meta-value" data-agent-id="el-011">Login bereit</div>
          </div>
        </div>

        <div class="auth-layout" data-agent-id="el-048">
          <div class="auth-card" data-agent-id="el-049">
            <div class="auth-tabs" data-agent-id="el-050">
              <a href="login.html" class="auth-tab" data-agent-id="el-029">Login</a>
              <a href="registration.html" class="auth-tab active" data-agent-id="el-030">Registrieren</a>
            </div>
            <div class="section-title" style="margin-top: 10px;" data-agent-id="el-051">Workout Registrierung</div>
            <div class="section-text" style="margin-bottom: 10px;" data-agent-id="el-052">Erstelle einen neuen Account.</div>
            
            <div class="field" data-agent-id="el-053">
              <label data-agent-id="el-054">Name</label>
              <input class="input" type="text" placeholder="Dein Name" data-agent-id="el-042">
            </div>
            <div class="field" data-agent-id="el-040">
              <label data-agent-id="el-041">E-Mail</label>
              <input class="input" type="email" placeholder="name@beispiel.de" data-agent-id="el-042">
            </div>
            <div class="field" data-agent-id="el-043">
              <label data-agent-id="el-044">Passwort</label>
              <input class="input" type="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" data-agent-id="el-042">
            </div>
            
            <a href="../overview/overview.html" class="button-full" data-agent-id="el-030">Registrieren</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
