<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Workout App Prototype</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="background-orb-top"></div>
    <div class="background-orb-bottom"></div>
    <main class="content">
      <div class="shell">
        <div class="top-bar">
          <div>
            <div class="brand">Workout App</div>
            <div class="title">Train smart. Look sharp.</div>
            <div class="subtitle">Die App ist wieder funktional, sportlich und auf echte Nutzung ausgelegt.</div>
          </div>
          <div class="top-bar-meta">
            <div class="meta-label">GUEST MODE</div>
            <div class="meta-value">Login bereit</div>
          </div>
        </div>

        <div class="auth-layout">
          <div class="auth-card">
            <div class="auth-tabs">
              <a href="login.html" class="auth-tab active">Login</a>
              <a href="registration.html" class="auth-tab">Registrieren</a>
            </div>
            <div class="section-title" style="margin-top: 10px;">Workout Login</div>
            <div class="section-text" style="margin-bottom: 10px;">Melde dich an oder registriere dich mit beliebigen nicht-leeren Werten.</div>
            
            <div class="field">
              <label>E-Mail</label>
              <input class="input" type="email" placeholder="name@beispiel.de" />
            </div>
            <div class="field">
              <label>Passwort</label>
              <input class="input" type="password" placeholder="••••••••" />
            </div>
            
            <a href="../overview/overview.html" class="button-full">Anmelden</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
